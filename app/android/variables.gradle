ext {
    // 31, not 30 (2026-09-06): AdviceWorker is enqueued .setExpedited(), which on
    // API 30 needs a foreground service + getForegroundInfo() the app does not
    // have (see the FOREGROUND_SERVICE note in AndroidManifest.xml). From 31 it
    // is an expedited job. getCurrentLocation needs 30 anyway; MVP targets a
    // Pixel 10 Pro.
    minSdkVersion = 31
    compileSdkVersion = 34
    targetSdkVersion = 34
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
}