[pytest]
# The suite lives in server/tests/, not ./tests/, because the tests import
# `engine` and `llm` from server/ by relative path. Declaring testpaths is what
# makes that discoverable: the shared pre-push gate skips the pytest step
# entirely for a repo with no ./tests and no declared testpaths, which is how
# these 362 characterization tests went unrun at every push until 2026-08-08.
#
# Scoping to server/tests also keeps collection off scripts/ and app/, where
# check_*.py helpers call sys.exit() at module level.
testpaths = server/tests
